name: Build Release APK

# 触发条件：打 v 开头的 tag 自动发版；也可在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建 GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          accept-android-sdk-licenses: 'yes'

      # compileSdk=37 (Miuix 0.9.0 要求), 显式安装(含预览通道以防37为预览版)
      - name: Install Android platform 37
        run: |
          yes | sdkmanager --channel=0,1,2,3 "platforms;android-37" "build-tools;37.0.0" || echo "警告: android-37 安装失败"
          sdkmanager --list_installed 2>/dev/null | grep -i "android-37" || echo "(未检测到 android-37)"

      # 诊断: 确认 CI 能访问 Maven Central 及环境变量(排查 KSP 解析问题)
      - name: Diagnose repository access
        run: |
          echo "=== 环境变量 ==="
          echo "CI=${CI:-<未设置>}"
          echo "GITHUB_ACTIONS=${GITHUB_ACTIONS:-<未设置>}"
          echo "=== Maven Central KSP pom 可达性 ==="
          curl -sI "https://repo1.maven.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.8/com.google.devtools.ksp.gradle.plugin-2.3.8.pom" | head -1 || echo "curl 失败"
          echo "=== settings.gradle.kts 仓库配置 ==="
          cat settings.gradle.kts

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleStandardRelease assembleMiuiRelease --no-daemon

      # 打 tag 时：上传 APK 到 GitHub Release
      - name: Upload APKs to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/miui/release/*.apk
          generate_release_notes: true

      # 手动触发时：作为 artifact 下载
      - name: Upload APKs as artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/miui/release/*.apk
